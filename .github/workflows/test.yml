name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download
      MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libjs-mathjax build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Check Rust formatting
        run: cargo fmt
        working-directory: src-tauri

      - name: Rust Checks & Lints
        run: cargo check
        working-directory: src-tauri
        
      - name: Run Rust Tests
        run: cargo test
        working-directory: src-tauri

      - name: AI Pipeline Integration Test
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          mkdir -p test_models
          wget https://raw.githubusercontent.com/Linzaer/Ultra-Light-Fast-Generic-Face-Detector-1MB/master/models/onnx/version-RFB-320.onnx -O test_models/version-RFB-320.onnx
          cargo test -- --ignored test_full_inference_on_sample
        working-directory: src-tauri
        
      - name: Build Tauri App
        # Just compile everything without creating installers to save CI time
        run: npm run tauri build -- --no-bundle
