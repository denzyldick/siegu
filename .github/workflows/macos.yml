name: macOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  ci:
    runs-on: macos-latest
    env:
      ORT_STRATEGY: download

    steps:
      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: |
          brew install pkg-config nasm

      - run: bun install

      # Frontend checks (translations/typecheck/lint/prettier/test:coverage),
      # `cargo fmt --check` and `cargo audit` are OS-independent and already
      # run once in ubuntu.yml, so they are intentionally omitted here to avoid
      # triple-running them on every PR (the main driver of long CI time).
      # Full ONNX model inference is Ubuntu-only as well (see ubuntu.yml).

      - run: cargo test
        working-directory: src-tauri

      - run: cargo test -p siegu-core
        working-directory: src-tauri

      # cargo check --all-targets type-checks every target including tests,
      # with no full codegen or linting, so it is much faster than clippy.
      - run: cargo check --all-targets
        working-directory: src-tauri

      - name: Build Tauri App (no bundle)
        run: bun run tauri build --no-bundle

      # ── Mesh sync over a real LAN signaling server, no ML models ─────────
      - name: Build CLI (release)
        run: cargo build --release -p siegu-cli

      - name: Run mesh sync E2E (in-process signaling)
        run: bash scripts/e2e-sync.sh

      # ── View-only browsing + RPC share modes over the same stack (#19) ──
      - name: Run view-only + RPC E2E
        run: bash scripts/e2e-view-only.sh