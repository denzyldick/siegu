name: "Publish Signalling Server Docker Image"

on:
  push:
    branches:
      - "main"
    paths:
      - "crates/siegu-core/src/lan_server.rs"
      - "crates/siegu-core/src/signal.rs"
      - "crates/siegu-core/src/mesh_transport.rs"
      - "crates/siegu-signal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/signal-docker.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
    paths:
      - "crates/siegu-core/src/lan_server.rs"
      - "crates/siegu-core/src/signal.rs"
      - "crates/siegu-core/src/mesh_transport.rs"
      - "crates/siegu-signal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/signal-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}-signal"

jobs:
  build-image:
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Build Docker image (no push)"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          file: "crates/siegu-signal/Dockerfile"
          push: false
          load: true
          tags: "siegu-signal:ci-smoke"

      - name: "Smoke-test image (run + healthcheck)"
        run: |
          docker run -d --name siegu-signal-smoke -p 18080:8080 siegu-signal:ci-smoke
          for _ in $(seq 1 30); do
            if curl -sf --max-time 4 -o /dev/null http://127.0.0.1:18080/healthz; then
              echo "signaling server healthy"
              docker rm -f siegu-signal-smoke
              exit 0
            fi
            sleep 1
          done
          echo "signaling server did not become healthy" >&2
          docker logs siegu-signal-smoke
          docker rm -f siegu-signal-smoke
          exit 1

  build-and-push-image:
    if: github.event_name != 'pull_request'
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Log in to the Container registry"
        uses: "docker/login-action@v3"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Expose repository name in lowercase"
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}"
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.sha }}

      - name: "Build Docker image (load for smoke test)"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          file: "crates/siegu-signal/Dockerfile"
          push: false
          load: true
          tags: "siegu-signal:smoke-test"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

      - name: "Smoke-test image before publishing"
        run: |
          docker run -d --name siegu-signal-smoke -p 18080:8080 siegu-signal:smoke-test
          for _ in $(seq 1 30); do
            if curl -sf --max-time 4 -o /dev/null http://127.0.0.1:18080/healthz; then
              echo "signaling server healthy"
              docker rm -f siegu-signal-smoke
              exit 0
            fi
            sleep 1
          done
          echo "signaling server did not become healthy" >&2
          docker logs siegu-signal-smoke
          docker rm -f siegu-signal-smoke
          exit 1

      - name: "Push Docker image"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          file: "crates/siegu-signal/Dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: "type=gha"

  # Mesh sync E2E against the exact container built from this commit.
  # Runs after publishing so the sha-tagged image is guaranteed to exist.
  mesh-sync-e2e:
    if: github.event_name != 'pull_request'
    needs: build-and-push-image
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      packages: "read"
    env:
      ORT_STRATEGY: download

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential curl wget file

      - name: Build CLI
        run: cargo build --release -p siegu-cli

      - name: Start signaling server container (this commit's image)
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Pulling $IMG"
          docker pull "$IMG"
          docker run -d --name siegu-signal -p 8080:8080 "$IMG"
          for _ in $(seq 1 30); do
            if curl -sf --max-time 4 -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "signaling server healthy"
              exit 0
            fi
            sleep 1
          done
          echo "signaling server did not become healthy" >&2
          docker logs siegu-signal
          exit 1

      - name: Run mesh sync E2E (Docker signaling server)
        run: |
          SIEGU_SIGNAL_URL=ws://127.0.0.1:8080 bash scripts/e2e-sync.sh
