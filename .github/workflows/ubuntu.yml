name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Everything on Ubuntu in a single job ───────────────────────────────
  # Unit tests, lint — typecheck, security audit, desktop build, LAN mesh E2E,
  # face-grouping E2E and full ONNX model inference. One job shares the cargo
  # target dir so the workspace is compiled once instead of once per stage.
  ci:
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libjs-mathjax build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpostproc-dev ffmpeg nasm

      - run: bun install

      - run: bun run check:translations

      - run: bun run typecheck

      - run: bun run lint

      - run: bun x prettier --check "src/**/*.{js,vue,ts,css,json}"

      - run: bun run test:coverage

      - run: cargo fmt --check
        working-directory: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

      - run: cargo test
        working-directory: src-tauri

      - run: cargo test -p siegu-core
        working-directory: src-tauri

      # cargo check --all-targets type-checks every target including tests,
      # with no full codegen or linting, so it is much faster than clippy.
      - run: cargo check --all-targets
        working-directory: src-tauri

      - name: Build Tauri App (no bundle)
        run: bun run tauri build --no-bundle

      # ── Mesh sync over a real LAN signaling server, no ML models ─────────
      - name: Build CLI (release)
        run: cargo build --release -p siegu-cli

      - name: Run mesh sync E2E (in-process signaling)
        run: bash scripts/e2e-sync.sh

      # ── View-only browsing + RPC share modes over the same stack (#19) ──
      - name: Run view-only + RPC E2E
        run: bash scripts/e2e-view-only.sh

      - name: Cache E2E models
        uses: actions/cache@v4
        with:
          path: /tmp/siegu-e2e-models
          key: siegu-e2e-models-v2

      - name: Run face-grouping E2E
        env:
          SIEGU_MODELS_DIR: /tmp/siegu-e2e-models
        run: bash scripts/e2e-face-grouping.sh

      # ── Full ONNX model inference on real photos/videos ────────────────
      - name: Cache AI test models
        uses: actions/cache@v4
        with:
          path: src-tauri/test_models
          key: ai-test-models-v3-${{ runner.os }}

      - name: AI Pipeline Integration Test
        shell: bash
        run: |
          bash ../scripts/download-models.sh
          cargo test -- --ignored test_full_inference_on_sample
          cargo test -- --ignored test_full_inference_on_video_sample
          cargo test -- --ignored test_whisper_smoke
          cargo test -p siegu-core -- --ignored session_pool_allows_concurrent_locks
        working-directory: src-tauri
