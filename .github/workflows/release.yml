name: Release

# Release-driven flow:
#
#   * Create a release from a vX.Y.Z tag on GitHub (draft or published), or
#     push a v* tag, and this workflow builds every platform and attaches the
#     installers/APK to that release. Assets are attached to the release whose
#     tag triggered the run — no manual upload step.
#
# Triggers:
#   - release:created   (draft or published — build starts as soon as you
#                        create the release from a tag; publishing later does
#                        NOT rebuild, assets are already attached)
#   - push of v* tags   (a bare tag push builds and creates a draft release
#                        if none exists yet)
#   - workflow_dispatch (manual escape hatch; pass the tag you want to build)
#
# We deliberately do NOT trigger on `release: published` or `push: main`:
# publishing a draft must not kick off a redundant rebuild, and shipping is
# driven by the tag/release you create, not by every commit landing on main.
on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach artifacts to (e.g. v0.1.13 default: derive from the latest release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name || inputs.release_tag || github.sha }}
  cancel-in-progress: true

jobs:
  # ── Gate: resolve the tag, wait for all platform CI, pre-create the draft ──
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
      release_title: ${{ steps.decide.outputs.release_title }}
      version: ${{ steps.decide.outputs.version }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Resolve tag, wait for CI, pre-create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Figure out which release/tag we are building for. Order:
          # 1. `release: created` — the release object carries the tag.
          # 2. tag push — refs/tags/vX.Y.Z.
          # 3. manual dispatch — explicit input, else the latest existing release.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TITLE="${{ github.event.release.name }}"
            echo "Trigger: release '${{ github.event.release.name }}' tag=$TAG"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Siegu $TAG"
            echo "Trigger: tag push $TAG"
          else
            if [ -n "${{ inputs.release_tag }}" ]; then
              TAG="${{ inputs.release_tag }}"
              TITLE="Siegu $TAG"
              echo "Trigger: manual dispatch tag=$TAG"
            else
              TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
              TITLE="Siegu $TAG"
              echo "Trigger: manual dispatch (latest release) tag=$TAG"
            fi
          fi

          # A release only makes sense for vX.Y.Z tags (updater resolves the
          # pure semver from latest.json; hash-suffixed draft tags are legacy).
          case "$TAG" in
            v[0-9]*\.[0-9]*\.[0-9]*) echo "OK: tag $TAG" ;;
            *) echo "::error::Tag '$TAG' is not a vX.Y.Z release tag — refusing to build."; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          SHORT_SHA=$(git rev-parse --short=9 HEAD)
          HEAD_SHA=$(git rev-parse HEAD)
          [ -z "$TITLE" ] && TITLE="Siegu v${VERSION}"

          echo "Version: $VERSION | HEAD: $SHORT_SHA | Tag: $TAG"

          # The tag and the app version must agree: the updater derives the
          # version from tauri.conf.json, so a release tagged v0.1.13 while
          # tauri.conf.json still says 0.1.12 would attach a 0.1.12 update
          # manifest to a v0.1.13 release and break delta updates.
          CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$CONF_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG is v$VERSION but tauri.conf.json still pins $CONF_VERSION. Bump the app version first."
            exit 1
          fi

          # ── Wait for the CI workflows for the commit being released ─────
          # The release should only ship after every supported platform has
          # passed its own CI on exactly this commit.
          FAILED=0
          TIMEOUT=$((60 * 95))
          for wf in Ubuntu Windows macOS Android iOS; do
            FILE="${wf,,}.yml"
            echo "--- Waiting for $wf CI on $HEAD_SHA ---"
            CONCLUSION=""
            DEADLINE=$((SECONDS + TIMEOUT))
            while :; do
              READOUT=$(gh run list --workflow="$FILE" --commit="$HEAD_SHA" \
                --limit 1 --json databaseId,status,conclusion \
                --jq '.[0] | "\(.status) \(.conclusion // "")"' 2>/dev/null || echo "missing ")
              STATUS=${READOUT%% *}
              CONCLUSION=${READOUT#* }
              if [ "$STATUS" = "completed" ]; then
                break
              fi
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "::error::Timed out waiting for $wf CI on $HEAD_SHA"
                FAILED=1
                break
              fi
              sleep 30
            done
            echo "$wf CI concluded: ${CONCLUSION:-unknown}"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::$wf CI did not pass for $HEAD_SHA (conclusion: $CONCLUSION)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::CI has not passed for this commit. Fix CI before releasing."
            exit 1
          fi
          echo "All CI checks passed for $HEAD_SHA"

          # ── Ensure the target release exists so parallel jobs can attach ──
          # On `release: created` it always exists. On a bare tag push it may
          # not, so create a draft the build jobs append to (prevents the
          # Android uploader racing ahead and publishing its own release).
          if ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$HEAD_SHA" \
              --title "$TITLE" \
              --notes "Automated build for v${VERSION} (${SHORT_SHA}). Review the assets, then publish to ship."
            echo "Created draft release $TAG"
          else
            echo "Release $TAG already exists — assets will be appended"
          fi

          {
            echo "should_release=true"
            echo "tag_name=$TAG"
            echo "release_title=$TITLE"
            echo "version=$VERSION"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

  # ── Desktop installers (macOS, Ubuntu, Windows) ────────────────────────
  desktop:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APP_COMMIT_SHA: ${{ needs.ci-gate.outputs.short_sha }}

    steps:
      - name: Force LF line endings (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key-suffix: release-${{ matrix.platform }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libjs-mathjax build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpostproc-dev nasm

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install nasm

      # Mirror of windows.yml CI setup: ffmpeg-sys-next builds FFmpeg from
      # source (features = ["build"]) and needs the full MSVC dev environment,
      # nasm, and a coherent MSYS2 sh+make+gawk toolchain. Omitting any of
      # these fails `tauri build` with "configure failed" before any installer
      # is produced.
      - name: Set up MSVC dev environment (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install nasm (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Set up MSYS2 (make + gawk for the ffmpeg source build) (Windows)
        if: matrix.platform == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          release: false # reuse the preinstalled C:\msys64
          update: false
          install: make gawk

      - name: Prepend MSYS2 tools to PATH (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin'
          # coreutils' link.exe would shadow MSVC's linker (rustc resolves
          # link.exe via PATH) and break every Rust link step.
          Remove-Item (Join-Path $bin 'link.exe') -Force -ErrorAction SilentlyContinue
          Write-Host "Prepending $bin to PATH"
          Add-Content $env:GITHUB_PATH $bin

      - run: bun install

      - name: Prepare signing key
        shell: bash
        run: |
          KEY='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          # Only use the key when it looks like a real updater key: base64 that
          # decodes to UTF-8 and has the minisign/rsign "encrypted secret key"
          # box header (a pasted public key box is rejected). A malformed secret
          # otherwise kills every desktop build at the updater signing step (the
          # same `tauri build` that is green in CI with --no-bundle), so fall
          # back to an unsigned build instead of failing the release.
          if [ -n "$KEY" ] \
            && DECODED="$(printf '%s' "$KEY" | base64 -d 2>/dev/null)" \
            && printf '%s' "$DECODED" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1 \
            && printf '%s' "$DECODED" | grep -q 'encrypted secret key'; then
            # Write into the workspace and export a workspace-relative path:
            # a $HOME-based path is shell-specific (git-bash on Windows yields
            # /home/runneradmin/..., which the Rust build cannot resolve, so
            # tauri then misreads the path string itself as the key).
            KEYFILE="$GITHUB_WORKSPACE/.tauri-signing.key"
            printf '%s' "$KEY" > "$KEYFILE"
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEYFILE" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY missing or malformed (not a valid minisign key box); building unsigned installers."
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri App
        if: env.SIGNING_READY == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.ci-gate.outputs.tag_name }}
          releaseName: ${{ needs.ci-gate.outputs.release_title }}
          releaseBody: 'See the attached assets for the latest release versions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-24.04' && '--bundles appimage deb' || '' }}

      - name: Build Tauri App (unsigned)
        if: env.SIGNING_READY != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.ci-gate.outputs.tag_name }}
          releaseName: ${{ needs.ci-gate.outputs.release_title }}
          releaseBody: 'See the attached assets for the latest release versions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-24.04' && '--bundles appimage deb --no-sign' || '--no-sign' }}

  # ── Android APK ─────────────────────────────────────────────────────────
  android:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
      APP_COMMIT_SHA: ${{ needs.ci-gate.outputs.short_sha }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-linux-android
          workspaces: src-tauri
          cache-key-suffix: release-android

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Ensure rust targets are installed
        run: rustup target add aarch64-linux-android || true

      - name: Patch ffmpeg-sys-next for Android cross-compilation
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          BUILD_RS=$(find ~/.cargo/registry/src -path "*/ffmpeg-sys-next-*/build.rs" -print -quit 2>/dev/null || true)
          if [ -z "$BUILD_RS" ]; then
            echo "ffmpeg-sys-next build.rs not found, skipping patch"
            exit 0
          fi
          echo "Patching $BUILD_RS"
          python3 scripts/patch-ffmpeg-android.py "$BUILD_RS"

      - run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Rust lib for aarch64
        run: |
          cargo ndk -t aarch64-linux-android -P 24 \
            --manifest-path src-tauri/Cargo.toml \
            build --features "tauri/custom-protocol tauri/custom-protocol" --lib --release

      - name: Generate gitignored tauri.settings.gradle
        working-directory: src-tauri
        run: |
          # gen/android tracks an older-style scaffold whose settings.gradle
          # applies 'tauri.settings.gradle'. That file embeds absolute paths
          # into the local cargo registry so it is gitignored, and it must be
          # derived here from Cargo.lock: crate versions are pinned by the
          # lockfile, and `tauri android init` can neither regenerate it (the
          # tracked project uses a scaffold layout that newer CLIs no longer
          # emit) nor run against the existing project without skipping it.
          CRATES=$(echo "$HOME/.cargo/registry/src"/index.crates.io-*)
          ver() { grep -A1 "^name = \"$1\"\$" ../Cargo.lock | grep '^version' | cut -d'"' -f2; }
          cat > gen/android/tauri.settings.gradle <<EOF
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          include ':tauri-android'
          project(':tauri-android').projectDir = new File("$CRATES/tauri-$(ver tauri)/mobile/android")
          include ':tauri-plugin-dialog'
          project(':tauri-plugin-dialog').projectDir = new File("$CRATES/tauri-plugin-dialog-$(ver tauri-plugin-dialog)/android")
          include ':tauri-plugin-fs'
          project(':tauri-plugin-fs').projectDir = new File("$CRATES/tauri-plugin-fs-$(ver tauri-plugin-fs)/android")
          include ':tauri-plugin-notification'
          project(':tauri-plugin-notification').projectDir = new File("$CRATES/tauri-plugin-notification-$(ver tauri-plugin-notification)/android")
          include ':tauri-plugin-opener'
          project(':tauri-plugin-opener').projectDir = new File("$CRATES/tauri-plugin-opener-$(ver tauri-plugin-opener)/android")
          EOF
          echo "generated gen/android/tauri.settings.gradle:"; cat gen/android/tauri.settings.gradle

      - name: Copy .so files to jniLibs
        run: |
          # libsiegu_lib.so is NEEDED-linked against libc++_shared.so (C++
          # deps: ffmpeg, ort). Locally that file exists as a gitignored
          # symlink into the NDK; CI must copy it from the NDK sysroot or the
          # APK ships without it and dlopen fails at launch (instant crash).
          JNILIBS=src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNILIBS"
          cp target/aarch64-linux-android/release/libsiegu_lib.so "$JNILIBS/"
          LIBCXX=$(find "$ANDROID_HOME/ndk" -path "*sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" -print -quit)
          if [ -z "$LIBCXX" ]; then
            echo "libc++_shared.so not found in NDK sysroot" >&2
            exit 1
          fi
          cp "$LIBCXX" "$JNILIBS/"
          echo "jniLibs now contains:"; ls -la "$JNILIBS"

      # app/build.gradle.kts signs releases with the debug keystore at
      # ~/.android/debug.keystore (standard Android debug credentials). That
      # file does not exist on fresh runners, and generating a random one per
      # run would change the APK signature every release, so a fixed keystore
      # is stored in ANDROID_KEYSTORE_B64.
      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: src-tauri/gen/android
        # The .so was already built with cargo-ndk and copied into jniLibs
        # above; skip the in-Gradle Rust rebuild (which would also need the
        # x86_64-linux-android target this job does not install).
        run: ./gradlew assembleUniversalRelease -PskipRustBuild=true

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.ci-gate.outputs.tag_name }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  # ── iOS (real gate: the app must BUILD; no signed artifact is attached) ─
  # ios.yml already runs the core test suite on a simulator against this
  # commit, so this job only needs to prove the iOS app itself compiles and
  # bundles. Building for the simulator requires no Apple developer account
  # or signing identity, but it WILL fail the workflow if the iOS target
  # regresses. No artifact is uploaded — shipping an .ipa needs App Store
  # credentials that are out of scope for the automated release.
  ios:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim
          workspaces: crates,src-tauri
          cache-key-suffix: release-ios

      - run: bun install

      # The Xcode project scaffold (src-tauri/gen/apple) is not tracked in
      # the repo, only the Android one is — regenerate it here so the build
      # below proves the full iOS app (not just cargo check) compiles and
      # bundles. This is intentionally NOT guarded with `|| echo "skipped"`
      # anymore: a broken iOS build must fail the release.
      - name: Initialize iOS project scaffold
        run: npm run tauri ios init

      - name: Build iOS app for simulator (real gate)
        run: npm run tauri ios build -- --debug --target aarch64-sim