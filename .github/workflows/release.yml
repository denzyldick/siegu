name: Release

# Automated flow: a push to main that introduces a brand-new app version
# (per src-tauri/tauri.conf.json) waits for CI to pass, then builds every
# platform and attaches the artifacts to a DRAFT release tagged
# v<version>-<short-sha> (e.g. v0.1.8-gahafeufae). Publishing the draft is
# the only manual step; the Tauri updater picks the release up on publish
# because latest.json carries the pure semver version.
#
# Note: the old `release: published` trigger was removed on purpose —
# publishing a draft must not kick off a redundant full rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate: version-bump detection + CI wait + draft pre-create ───────────
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
      release_title: ${{ steps.decide.outputs.release_title }}
      version: ${{ steps.decide.outputs.version }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        name: Decide release, wait for CI, pre-create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          SHORT_SHA=$(git rev-parse --short=9 HEAD)
          TAG="v${VERSION}-${SHORT_SHA}"
          TITLE="Siegu v${VERSION} (${SHORT_SHA})"
          HEAD_SHA=$(git rev-parse HEAD)

          echo "App version: $VERSION | HEAD: $SHORT_SHA | Tag: $TAG"

          # workflow_dispatch = manual escape hatch: always (re)build assets
          # for the current version, attaching to whatever release exists.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — forcing release"
            SHOULD=true
          else
            # Release only when this exact version has never been shipped,
            # draft or published. Covers both legacy plain tags (v0.1.8)
            # and hash-suffixed ones (v0.1.8-gahafeufae).
            EXISTING=$(gh release list --limit 100 \
              --json tagName \
              --jq ".[].tagName | select(. == \"v${VERSION}\" or startswith(\"v${VERSION}-\"))")
            if [ -n "$EXISTING" ]; then
              echo "Version $VERSION already has a release/draft ($EXISTING) — nothing to do"
              SHOULD=false
            else
              echo "New version detected — releasing"
              SHOULD=true
            fi
          fi

          {
            echo "should_release=$SHOULD"
            echo "tag_name=$TAG"
            echo "release_title=$TITLE"
            echo "version=$VERSION"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          if [ "$SHOULD" != "true" ]; then
            exit 0
          fi

          # ── Wait for the CI workflows triggered by this same push ────────
          # Avoids duplicating toolchain setup that CI already validates.
          FAILED=0
          TIMEOUT=$((60 * 95))
          for wf in Ubuntu Windows macOS Android; do
            FILE="${wf,,}.yml"
            echo "--- Waiting for $wf CI on $HEAD_SHA ---"
            CONCLUSION=""
            DEADLINE=$((SECONDS + TIMEOUT))
            while :; do
              READOUT=$(gh run list --workflow="$FILE" --commit="$HEAD_SHA" \
                --limit 1 --json databaseId,status,conclusion \
                --jq '.[0] | "\(.status) \(.conclusion // "")"' 2>/dev/null || echo "missing ")
              STATUS=${READOUT%% *}
              CONCLUSION=${READOUT#* }
              if [ "$STATUS" = "completed" ]; then
                break
              fi
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "::error::Timed out waiting for $wf CI on $HEAD_SHA"
                FAILED=1
                break
              fi
              sleep 30
            done
            echo "$wf CI concluded: ${CONCLUSION:-unknown}"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::$wf CI did not pass for $HEAD_SHA (conclusion: $CONCLUSION)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::CI has not passed for this commit. Fix CI before releasing."
            exit 1
          fi
          echo "All CI checks passed for $HEAD_SHA"

          # ── Pre-create the draft so parallel build jobs attach to it ────
          # Without this, the Android uploader would race ahead and publish
          # its own release before tauri-action finishes the desktop one.
          if ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$HEAD_SHA" \
              --title "$TITLE" \
              --notes "Automated draft build for v${VERSION} (${SHORT_SHA}). Review the assets, then publish to ship."
            echo "Created draft release $TAG"
          else
            echo "Release $TAG already exists — assets will be appended"
          fi

  # ── Desktop installers (macOS, Ubuntu, Windows) ────────────────────────
  desktop:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APP_COMMIT_SHA: ${{ needs.ci-gate.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libjs-mathjax build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpostproc-dev nasm

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install nasm

      # Mirror of windows.yml CI setup: ffmpeg-sys-next builds FFmpeg from
      # source (features = ["build"]) and needs the full MSVC dev environment,
      # nasm, and a coherent MSYS2 sh+make+gawk toolchain. Omitting any of
      # these fails `tauri build` with "configure failed" before any installer
      # is produced.
      - name: Set up MSVC dev environment (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install nasm (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Set up MSYS2 (make + gawk for the ffmpeg source build) (Windows)
        if: matrix.platform == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          release: false # reuse the preinstalled C:\msys64
          update: false
          install: make gawk

      - name: Prepend MSYS2 tools to PATH (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin'
          # coreutils' link.exe would shadow MSVC's linker (rustc resolves
          # link.exe via PATH) and break every Rust link step.
          Remove-Item (Join-Path $bin 'link.exe') -Force -ErrorAction SilentlyContinue
          Write-Host "Prepending $bin to PATH"
          Add-Content $env:GITHUB_PATH $bin

      - run: npm ci

      - name: Prepare signing key
        shell: bash
        run: |
          KEY='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          # Only use the key when it looks like a real updater key: base64 that
          # decodes to UTF-8 and has the minisign/rsign "encrypted secret key"
          # box header (a pasted public key box is rejected). A malformed secret
          # otherwise kills every desktop build at the updater signing step (the
          # same `tauri build` that is green in CI with --no-bundle), so fall
          # back to an unsigned build instead of failing the release.
          if [ -n "$KEY" ] \
            && DECODED="$(printf '%s' "$KEY" | base64 -d 2>/dev/null)" \
            && printf '%s' "$DECODED" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1 \
            && printf '%s' "$DECODED" | grep -q 'encrypted secret key'; then
            # Write into the workspace and export a workspace-relative path:
            # a $HOME-based path is shell-specific (git-bash on Windows yields
            # /home/runneradmin/..., which the Rust build cannot resolve, so
            # tauri then misreads the path string itself as the key).
            KEYFILE="$GITHUB_WORKSPACE/.tauri-signing.key"
            printf '%s' "$KEY" > "$KEYFILE"
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEYFILE" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY missing or malformed (not a valid minisign key box); building unsigned installers."
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri App
        if: env.SIGNING_READY == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.ci-gate.outputs.tag_name }}
          releaseName: ${{ needs.ci-gate.outputs.release_title }}
          releaseBody: 'See the attached assets for the latest release versions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-24.04' && '--bundles appimage deb' || '' }}

      - name: Build Tauri App (unsigned)
        if: env.SIGNING_READY != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.ci-gate.outputs.tag_name }}
          releaseName: ${{ needs.ci-gate.outputs.release_title }}
          releaseBody: 'See the attached assets for the latest release versions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-24.04' && '--bundles appimage deb --no-sign' || '--no-sign' }}

  # ── Android APK ─────────────────────────────────────────────────────────
  android:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
      APP_COMMIT_SHA: ${{ needs.ci-gate.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
          workspaces: src-tauri

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Ensure rust targets are installed
        run: rustup target add aarch64-linux-android || true

      - name: Patch ffmpeg-sys-next for Android cross-compilation
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          BUILD_RS=$(find ~/.cargo/registry/src -path "*/ffmpeg-sys-next-*/build.rs" -print -quit 2>/dev/null || true)
          if [ -z "$BUILD_RS" ]; then
            echo "ffmpeg-sys-next build.rs not found, skipping patch"
            exit 0
          fi
          echo "Patching $BUILD_RS"
          python3 scripts/patch-ffmpeg-android.py "$BUILD_RS"

      - run: npm ci

      - name: Build frontend
        run: yarn build

      - name: Build Rust lib for aarch64
        run: |
          cargo ndk -t aarch64-linux-android -P 24 \
            --manifest-path src-tauri/Cargo.toml \
            build --features "tauri/custom-protocol tauri/custom-protocol" --lib --release

      - name: Generate gitignored tauri.settings.gradle
        working-directory: src-tauri
        run: |
          # gen/android tracks an older-style scaffold whose settings.gradle
          # applies 'tauri.settings.gradle'. That file embeds absolute paths
          # into the local cargo registry so it is gitignored, and it must be
          # derived here from Cargo.lock: crate versions are pinned by the
          # lockfile, and `tauri android init` can neither regenerate it (the
          # tracked project uses a scaffold layout that newer CLIs no longer
          # emit) nor run against the existing project without skipping it.
          CRATES=$(echo "$HOME/.cargo/registry/src"/index.crates.io-*)
          ver() { grep -A1 "^name = \"$1\"\$" ../Cargo.lock | grep '^version' | cut -d'"' -f2; }
          cat > gen/android/tauri.settings.gradle <<EOF
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          include ':tauri-android'
          project(':tauri-android').projectDir = new File("$CRATES/tauri-$(ver tauri)/mobile/android")
          include ':tauri-plugin-dialog'
          project(':tauri-plugin-dialog').projectDir = new File("$CRATES/tauri-plugin-dialog-$(ver tauri-plugin-dialog)/android")
          include ':tauri-plugin-fs'
          project(':tauri-plugin-fs').projectDir = new File("$CRATES/tauri-plugin-fs-$(ver tauri-plugin-fs)/android")
          include ':tauri-plugin-notification'
          project(':tauri-plugin-notification').projectDir = new File("$CRATES/tauri-plugin-notification-$(ver tauri-plugin-notification)/android")
          include ':tauri-plugin-opener'
          project(':tauri-plugin-opener').projectDir = new File("$CRATES/tauri-plugin-opener-$(ver tauri-plugin-opener)/android")
          EOF
          echo "generated gen/android/tauri.settings.gradle:"; cat gen/android/tauri.settings.gradle

      - name: Copy .so to jniLibs
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libsiegu_lib.so \
             src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/

      # app/build.gradle.kts signs releases with the debug keystore at
      # ~/.android/debug.keystore (standard Android debug credentials). That
      # file does not exist on fresh runners, and generating a random one per
      # run would change the APK signature every release, so a fixed keystore
      # is stored in ANDROID_KEYSTORE_B64.
      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: src-tauri/gen/android
        # The .so was already built with cargo-ndk and copied into jniLibs
        # above; skip the in-Gradle Rust rebuild (which would also need the
        # x86_64-linux-android target this job does not install).
        run: ./gradlew assembleUniversalRelease -PskipRustBuild=true

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.ci-gate.outputs.tag_name }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  # ── iOS ─────────────────────────────────────────────────────────────────
  ios:
    needs: [ci-gate]
    if: needs.ci-gate.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ios
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri ios build || echo "iOS build skipped/failed. Please configure code signing."
