name: "Publish Landing Page Docker Image"

on:
  push:
    branches:
      - "main"
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page-docker.yml"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  # Converts repository name to lowercase automatically to comply with Docker conventions
  IMAGE_NAME: "${{ github.repository }}-landing-page"

jobs:
  build-image:
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Build Docker image (no push)"
        uses: "docker/build-push-action@v5"
        with:
          context: "./landing-page"
          push: false

  build-and-push-image:
    if: github.event_name != 'pull_request'
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Log in to the Container registry"
        uses: "docker/login-action@v3"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Expose repository name in lowercase"
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}"
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.sha }}

      - name: "Build and push Docker image"
        uses: "docker/build-push-action@v5"
        with:
          context: "./landing-page"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
