name: Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Cross-check the Tauri app and run core tests on an emulator ────────
  test:
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-linux-android,x86_64-linux-android
          workspaces: . # cache the whole checkout (crates/ is built here too)
          cache-key-suffix: android

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install cargo-ndk (prebuilt binary)
        run: |
          curl -sSLo /tmp/cargo-ndk.tgz https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz
          mkdir -p /tmp/cargo-ndk
          tar -xzf /tmp/cargo-ndk.tgz -C /tmp/cargo-ndk --strip-components=1
          install -m 755 /tmp/cargo-ndk/cargo-ndk "$HOME/.cargo/bin/cargo-ndk"

      - name: Patch ffmpeg-sys-next for Android cross-compilation
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          BUILD_RS=$(find ~/.cargo/registry/src -path "*/ffmpeg-sys-next-*/build.rs" -print -quit 2>/dev/null || true)
          if [ -z "$BUILD_RS" ]; then
            echo "ffmpeg-sys-next build.rs not found, skipping patch"
            exit 0
          fi
          echo "Patching $BUILD_RS"
          python3 scripts/patch-ffmpeg-android.py "$BUILD_RS"

      - name: Check Rust lib for Android (aarch64)
        working-directory: src-tauri
        run: cargo ndk -t aarch64-linux-android -P 24 check

      - name: Build core tests for Android (x86_64)
        run: |
          # ort-sys ships no prebuilt ONNX Runtime for x86_64-linux-android, so
          # the emulator test binaries are built with siegu-core's default
          # features (ml) disabled. Core lib + sync_e2e tests don't need ML, and
          # the aarch64 check above still validates the ML/ort cross-compile.
          cargo ndk -t x86_64-linux-android --platform 24 test -p siegu-core --lib --no-run --no-default-features
          cargo ndk -t x86_64-linux-android --platform 24 test -p siegu-core --test sync_e2e --no-run --no-default-features

      - name: Locate test binaries
        run: |
          echo "LIB_TEST=$(find target/x86_64-linux-android/debug/deps -maxdepth 1 -type f -perm -u+x -name 'siegu_core-*' | head -1)" >> $GITHUB_ENV
          echo "SYNC_TEST=$(find target/x86_64-linux-android/debug/deps -maxdepth 1 -type f -perm -u+x -name 'sync_e2e-*' | head -1)" >> $GITHUB_ENV

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # x86_64 guests on an x86_64 host use KVM, so they boot fast and
          # reliably. arm64-v8a images cannot use KVM here and routinely time
          # out booting under software emulation, so the ARM build is only
          # cross-checked above while tests actually run on x86_64.
          api-level: 30
          arch: x86_64
          target: aosp_atd
          force-avd-creation: true
          emulator-boot-timeout: 1800
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb push "$LIB_TEST" /data/local/tmp/siegu_core_tests
            adb push "$SYNC_TEST" /data/local/tmp/sync_e2e_tests
            adb shell chmod 755 /data/local/tmp/siegu_core_tests /data/local/tmp/sync_e2e_tests
            adb shell 'export TMPDIR=/data/local/tmp; /data/local/tmp/siegu_core_tests --test-threads 4'
            adb shell 'export TMPDIR=/data/local/tmp; /data/local/tmp/sync_e2e_tests --test-threads 2'
