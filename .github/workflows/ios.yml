name: iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Cross-check the Tauri app and run core tests on a simulator ────────
  test:
    runs-on: macos-latest
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim
          workspaces: crates,src-tauri
          cache-key-suffix: ios

      - run: bun install

      - run: cargo check --target aarch64-apple-ios
        working-directory: src-tauri

      - name: Build core tests for iOS simulator (aarch64)
        run: |
          cargo test -p siegu-core --lib --no-run --target aarch64-apple-ios-sim
          cargo test -p siegu-core --test sync_e2e --no-run --target aarch64-apple-ios-sim

      - name: Locate test binaries
        run: |
          echo "LIB_TEST=$(find target/aarch64-apple-ios-sim/debug/deps -maxdepth 1 -type f -perm -u+x -name 'siegu_core-*' | head -1)" >> $GITHUB_ENV
          echo "SYNC_TEST=$(find target/aarch64-apple-ios-sim/debug/deps -maxdepth 1 -type f -perm -u+x -name 'sync_e2e-*' | head -1)" >> $GITHUB_ENV

      - name: Run tests on iOS simulator
        run: |
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -E 'iPhone 15' | head -1 | sed -E 's/ \(com\.apple.*$//' \
            || xcrun simctl list devicetypes | grep -E 'iPhone 1[34]' | head -1 | sed -E 's/ \(com\.apple.*$//' \
            || xcrun simctl list devicetypes | grep -E 'iPhone' | head -1 | sed -E 's/ \(com\.apple.*$//')
          echo "Using device type: $DEVICETYPE"
          UDID=$(xcrun simctl create "Siegu-Test" "$DEVICETYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "Running core lib tests..."
          xcrun simctl spawn "$UDID" "$LIB_TEST" --test-threads 4
          echo "Running sync_e2e..."
          xcrun simctl spawn "$UDID" "$SYNC_TEST" --test-threads 2
