name: iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Cross-check the Tauri app and run core tests on a simulator ────────
  test:
    runs-on: macos-latest
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim
          workspaces: crates,src-tauri
          cache-key-suffix: ios

      - run: bun install

      - run: cargo check --target aarch64-apple-ios
        working-directory: src-tauri

      - name: Build core tests for iOS simulator (aarch64)
        run: |
          cargo test -p siegu-core --lib --no-run --target aarch64-apple-ios-sim
          cargo test -p siegu-core --test sync_e2e --no-run --target aarch64-apple-ios-sim

      - name: Locate test binaries
        run: |
          LIB_TEST=$(find target/aarch64-apple-ios-sim/debug/deps -maxdepth 1 -type f -perm -u+x -name 'siegu_core-*' | head -1)
          SYNC_TEST=$(find target/aarch64-apple-ios-sim/debug/deps -maxdepth 1 -type f -perm -u+x -name 'sync_e2e-*' | head -1)
          echo "LIB_TEST=$LIB_TEST" >> "$GITHUB_ENV"
          echo "SYNC_TEST=$SYNC_TEST" >> "$GITHUB_ENV"
          # Ad-hoc sign cross-compiled test binaries; freshly booted simulators
          # can otherwise reject spawn with NSPOSIXErrorDomain code 13.
          if [ -n "$LIB_TEST" ]; then codesign --force --sign - "$LIB_TEST" || true; fi
          if [ -n "$SYNC_TEST" ]; then codesign --force --sign - "$SYNC_TEST" || true; fi

      - name: Run tests on iOS simulator
        run: |
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -E 'iPhone 15' | head -1 | sed -E 's/ \(com\.apple.*$//' \
            || xcrun simctl list devicetypes | grep -E 'iPhone 1[34]' | head -1 | sed -E 's/ \(com\.apple.*$//' \
            || xcrun simctl list devicetypes | grep -E 'iPhone' | head -1 | sed -E 's/ \(com\.apple.*$//')
          echo "Using device type: $DEVICETYPE"
          UDID=$(xcrun simctl create "Siegu-Test" "$DEVICETYPE")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Give the simulator a moment to settle after boot before spawning.
          sleep 10
          # Standalone mode uses a NULL mach bootstrap port. Plain Rust test
          # binaries do not need simulator services, and this avoids launchd
          # rejecting repeated spawns with EACCES / "name exists" on CI hosts.
          echo "Running core lib tests..."
          for attempt in 1 2 3 4 5; do
            xcrun simctl spawn --standalone "$UDID" "$LIB_TEST" --test-threads 4 && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "simctl spawn failed for lib tests (attempt $attempt), retrying..."
            sleep 10
          done
          echo "Running sync_e2e..."
          for attempt in 1 2 3 4 5; do
            xcrun simctl spawn --standalone "$UDID" "$SYNC_TEST" --test-threads 2 && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "simctl spawn failed for sync_e2e (attempt $attempt), retrying..."
            sleep 10
          done
