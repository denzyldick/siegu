name: E2E Face Grouping

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  face-grouping:
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential curl wget file

      - name: Cache E2E models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /tmp/siegu-e2e-models
          key: siegu-e2e-models-v1

      - name: Build CLI
        run: cargo build --release -p siegu-cli

      - name: Run face-grouping E2E
        env:
          SIEGU_MODELS_DIR: /tmp/siegu-e2e-models
        run: bash scripts/e2e-face-grouping.sh
