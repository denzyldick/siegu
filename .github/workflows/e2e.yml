name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Mesh sync E2E over a real LAN signaling server, on every OS ────────
  # No ML models required. Two CLI instances connect via WebRTC, exchange
  # protocol messages, and transfer a photo with a byte-for-byte SHA-256 match.
  # On Ubuntu the same CLI build also runs the ML face-grouping E2E.
  sync-cli:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential curl wget file

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config

      - name: Build CLI
        run: cargo build --release -p siegu-cli

      - name: Run mesh sync E2E (in-process signaling)
        run: bash scripts/e2e-sync.sh

      - name: Cache E2E models (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: /tmp/siegu-e2e-models
          key: siegu-e2e-models-v2

      - name: Run face-grouping E2E (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        env:
          SIEGU_MODELS_DIR: /tmp/siegu-e2e-models
        run: bash scripts/e2e-face-grouping.sh
