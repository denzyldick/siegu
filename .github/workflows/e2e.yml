name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── ML face-grouping E2E (Ubuntu only — needs the AI model suite) ──────
  face-grouping:
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential curl wget file

      - name: Cache E2E models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /tmp/siegu-e2e-models
          key: siegu-e2e-models-v2

      - name: Build CLI
        run: cargo build --release -p siegu-cli

      - name: Run face-grouping E2E
        env:
          SIEGU_MODELS_DIR: /tmp/siegu-e2e-models
        run: bash scripts/e2e-face-grouping.sh

  # ── Mesh sync E2E over a real LAN signaling server, on every OS ────────
  # No ML models required. Two CLI instances connect via WebRTC, exchange
  # protocol messages, and transfer a photo with a byte-for-byte SHA-256 match.
  sync-cli:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential curl wget file

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config

      - name: Build CLI
        run: cargo build --release -p siegu-cli

      - name: Run mesh sync E2E (in-process signaling)
        run: bash scripts/e2e-sync.sh

  # ── Mesh sync E2E against the published signaling-server container ─────
  sync-docker:
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential curl wget file

      - name: Build CLI
        run: cargo build --release -p siegu-cli

      - name: Start signaling server container
        run: |
          docker pull ghcr.io/denzyldick/siegu-signal:latest
          docker run -d --name siegu-signal -p 8080:8080 ghcr.io/denzyldick/siegu-signal:latest
          for _ in $(seq 1 30); do
            if curl -sf --max-time 4 -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "signaling server healthy"
              exit 0
            fi
            sleep 1
          done
          echo "signaling server did not become healthy" >&2
          docker logs siegu-signal
          exit 1

      - name: Run mesh sync E2E (Docker signaling server)
        run: |
          SIEGU_SIGNAL_URL=ws://127.0.0.1:8080 bash scripts/e2e-sync.sh
