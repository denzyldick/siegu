name: GPUI desktop

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  check:
    name: GPUI desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          workspaces: .
          rust-components: rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-x11-dev

      - name: Check formatting
        run: cargo fmt -p siegu-desktop -- --check

      - name: Check GPUI desktop spike
        run: cargo check -p siegu-desktop --locked
