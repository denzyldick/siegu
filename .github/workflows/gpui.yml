name: GPUI web WASM build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build WASM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          workspaces: .
          rust-components: rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Check formatting
        run: cargo fmt -p siegu-web -- --check

      - name: Build WASM spike
        run: cargo build -p siegu-web --target wasm32-unknown-unknown --release
