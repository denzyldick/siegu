name: Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Everything on Windows in a single job ──────────────────────────────
  # Unit tests, lint — typecheck, security audit, desktop build, LAN mesh E2E and
  # full ONNX model inference. One job shares the cargo target dir so the
  # workspace is compiled once instead of once per stage.
  ci:
    runs-on: windows-latest
    env:
      ORT_STRATEGY: download

    steps:
      - name: Force LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ffmpeg-sys-next's configure (features = ["build"]) needs the full MSVC
      # dev environment (cl.exe, link.exe, INCLUDE/LIB) or it fails with
      # "cl.exe is unable to create an executable file".
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # FFmpeg is built from source by ffmpeg-sys-next (features = ["build"]),
      # which requires nasm for x86 assembly. vcpkg/FFMPEG_DIR is no longer used.
      - name: Install nasm
        shell: pwsh
        run: choco install nasm -y --no-progress

      # ffmpeg-sys-next builds FFmpeg from source by driving `sh configure
      # --toolchain=msvc` + GNU make. Mixing the runner's Git-Bash sh/gawk with a
      # standalone make corrupts common.mak's awk dep-generation snippet
      # (gsub(/\\/, "/") loses its backslash -> "awk: syntax error" on every .o).
      # A coherent MSYS2 toolchain (sh + make + gawk from one distribution)
      # avoids that; it must precede Git for Windows on PATH.
      - name: Set up MSYS2 (make + gawk for the ffmpeg source build)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          release: false # reuse the preinstalled C:\msys64
          update: false
          install: make gawk

      - name: Prepend MSYS2 tools to PATH
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin'
          # coreutils' link.exe would shadow MSVC's linker (rustc resolves
          # link.exe via PATH) and break every Rust link step.
          Remove-Item (Join-Path $bin 'link.exe') -Force -ErrorAction SilentlyContinue
          Write-Host "Prepending $bin to PATH"
          Add-Content $env:GITHUB_PATH $bin

      - run: npm ci

      - run: npm run check:translations

      - run: npm run typecheck

      - run: npm run lint

      - run: npx prettier --check "src/**/*.{js,vue,ts,css,json}"

      - run: npm run test:coverage

      - run: cargo fmt --check
        working-directory: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

      - run: cargo test
        working-directory: src-tauri

      - run: cargo test -p siegu-core
        working-directory: src-tauri

      # cargo check --all-targets type-checks every target including tests,
      # with no full codegen or linting, so it is much faster than clippy.
      - run: cargo check --all-targets
        working-directory: src-tauri

      - name: Build Tauri App (no bundle)
        run: npm run tauri build -- --no-bundle

      # ── Mesh sync over a real LAN signaling server, no ML models ─────────
      - name: Build CLI (release)
        run: cargo build --release -p siegu-cli

      - name: Run mesh sync E2E (in-process signaling)
        run: bash scripts/e2e-sync.sh

      # ── View-only browsing + RPC share modes over the same stack (#19) ──
      - name: Run view-only + RPC E2E
        run: bash scripts/e2e-view-only.sh

      # ── Full ONNX model inference on real photos/videos ────────────────
      - name: Cache AI test models
        uses: actions/cache@v4
        with:
          path: src-tauri/test_models
          key: ai-test-models-v3-${{ runner.os }}

      - name: AI Pipeline Integration Test
        shell: bash
        run: |
          mkdir -p test_models
          download_model() {
            local url="$1"
            local output="$2"
            if [ -s "$output" ]; then
              echo "Using cached $output"
              return
            fi
            curl --fail --location --retry 3 --retry-delay 5 "$url" --output "$output"
          }

          download_model "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model.onnx" "test_models/clip-vit-base-patch32-visual.onnx"
          download_model "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/text_model.onnx" "test_models/clip-vit-base-patch32-text.onnx"
          download_model "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/tokenizer.json" "test_models/tokenizer.json"
          download_model "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" "test_models/face_detection_yunet_2023mar.onnx"
          download_model "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/en_PP-OCRv3_det_infer.onnx" "test_models/ocr_det.onnx"
          download_model "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv3/en_PP-OCRv3_rec_infer.onnx" "test_models/ocr_rec.onnx"
          download_model "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/release/2.6/ppocr/utils/en_dict.txt" "test_models/en_dict.txt"
          download_model "https://huggingface.co/onnx-community/nsfw_image_detection-ONNX/resolve/main/onnx/model.onnx" "test_models/nsfw.onnx"
          download_model "https://huggingface.co/fsw/aesthetic-predictor-v2-5_onnx/resolve/main/aesthetic_predictor_v2_5.onnx" "test_models/aesthetics.onnx"
          download_model "https://huggingface.co/webml/yolov8n/resolve/main/onnx/yolov8n.onnx" "test_models/yolov8.onnx"
          download_model "https://huggingface.co/onnx-community/Salesforce_blip-image-captioning-base/resolve/main/split_0.onnx" "test_models/blip.onnx"
          download_model "https://huggingface.co/onnx-community/Salesforce_blip-image-captioning-base/resolve/main/split_1.onnx" "test_models/blip_decoder.onnx"
          download_model "https://huggingface.co/Salesforce/blip-image-captioning-base/resolve/main/tokenizer.json" "test_models/blip_tokenizer.json"
          download_model "https://huggingface.co/crj/dl-ws/resolve/main/arcface_w600k_r50.onnx" "test_models/arcface.onnx"
          download_model "https://huggingface.co/Xenova/dpt-hybrid-midas/resolve/main/onnx/model.onnx" "test_models/midas.onnx"
          download_model "https://huggingface.co/onnx-community/whisper-tiny-ONNX/resolve/main/onnx/encoder_model.onnx" "test_models/whisper.onnx"
          download_model "https://huggingface.co/onnx-community/whisper-tiny-ONNX/resolve/main/onnx/decoder_model_merged.onnx" "test_models/whisper-decoder.onnx"
          download_model "https://huggingface.co/onnx-community/whisper-tiny-ONNX/resolve/main/tokenizer.json" "test_models/whisper-tokenizer.json"

          cargo test -- --ignored test_full_inference_on_sample
          cargo test -- --ignored test_whisper_smoke
        working-directory: src-tauri
