name: Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  ci:
    runs-on: windows-latest
    env:
      ORT_STRATEGY: download

    steps:
      - name: Force LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # ffmpeg-sys-next's configure (features = ["build"]) needs the full MSVC
      # dev environment (cl.exe, link.exe, INCLUDE/LIB) or it fails with
      # "cl.exe is unable to create an executable file".
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # FFmpeg is built from source by ffmpeg-sys-next (features = ["build"]),
      # which requires nasm for x86 assembly. vcpkg/FFMPEG_DIR is no longer used.
      - name: Install nasm
        shell: pwsh
        run: choco install nasm -y --no-progress

      # ffmpeg-sys-next builds FFmpeg from source by driving `sh configure
      # --toolchain=msvc` + GNU make. Mixing the runner's Git-Bash sh/gawk with a
      # standalone make corrupts common.mak's awk dep-generation snippet
      # (gsub(/\\/, "/") loses its backslash -> "awk: syntax error" on every .o).
      # A coherent MSYS2 toolchain (sh + make + gawk from one distribution)
      # avoids that; it must precede Git for Windows on PATH.
      - name: Set up MSYS2 (make + gawk for the ffmpeg source build)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          release: false # reuse the preinstalled C:\msys64
          update: false
          install: make gawk

      - name: Prepend MSYS2 tools to PATH
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin'
          # coreutils' link.exe would shadow MSVC's linker (rustc resolves
          # link.exe via PATH) and break every Rust link step.
          Remove-Item (Join-Path $bin 'link.exe') -Force -ErrorAction SilentlyContinue
          Write-Host "Prepending $bin to PATH"
          Add-Content $env:GITHUB_PATH $bin

      - run: bun install

      # Frontend checks (translations/typecheck/lint/prettier/test:coverage),
      # `cargo fmt --check`, `cargo audit` and full ONNX model inference are
      # already covered once in ubuntu.yml, so they are intentionally omitted
      # here to avoid triple-running them on every PR (the main driver of long
      # CI time; the model download alone was several hundred MB per runner).

      - run: cargo test
        working-directory: src-tauri

      # cargo check --all-targets type-checks every target including tests,
      # with no full codegen or linting, so it is much faster than clippy.
      - run: cargo check --all-targets
        working-directory: src-tauri

      - name: Build Tauri App (no bundle)
        run: bun run tauri build --no-bundle

      # ── Mesh sync over a real LAN signaling server, no ML models ─────────
      - name: Build CLI (release)
        run: cargo build --release -p siegu-cli

      - name: Run mesh sync E2E (in-process signaling)
        run: bash scripts/e2e-sync.sh

      # ── View-only browsing + RPC share modes over the same stack (#19) ──
      - name: Run view-only + RPC E2E
        run: bash scripts/e2e-view-only.sh