name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libjs-mathjax build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpostproc-dev

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Install dependencies (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip -o ffmpeg.zip
          unzip ffmpeg.zip
          FFMPEG_DIR=$(pwd)/ffmpeg-master-latest-win64-gpl-shared
          FFMPEG_DIR_WIN=$(cygpath -w "$FFMPEG_DIR")
          echo "FFMPEG_DIR=$FFMPEG_DIR_WIN" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=$FFMPEG_DIR_WIN\\include" >> $GITHUB_ENV
          echo "FFMPEG_LIB_DIR=$FFMPEG_DIR_WIN\\lib" >> $GITHUB_ENV
          echo "INCLUDE=$FFMPEG_DIR_WIN\\include" >> $GITHUB_ENV
          echo "LIB=$FFMPEG_DIR_WIN\\lib" >> $GITHUB_ENV
          echo "$FFMPEG_DIR_WIN\\lib" >> $GITHUB_PATH

      - name: Set MSVC include path for bindgen (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -property installationPath
          $latestMsvc = Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $includePath = Join-Path $latestMsvc.FullName "include"
          "BINDGEN_EXTRA_CLANG_ARGS=-I`"$includePath`"" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: npm install

      - run: npm run check:translations

      - run: cargo fmt
        working-directory: src-tauri

      - run: cargo check
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

      - name: Cache AI test models
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: src-tauri/test_models
          key: ai-test-models-v1

      - name: AI Pipeline Integration Test
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          mkdir -p test_models
          download_model() {
            local url="$1"
            local output="$2"
            if [ -s "$output" ]; then
              echo "Using cached $output"
              return
            fi
            curl --fail --location --retry 3 --retry-delay 5 "$url" --output "$output"
          }

          download_model "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model.onnx" "test_models/clip-vit-base-patch32-visual.onnx"
          download_model "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/text_model.onnx" "test_models/clip-vit-base-patch32-text.onnx"
          download_model "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/tokenizer.json" "test_models/tokenizer.json"
          download_model "https://raw.githubusercontent.com/Linzaer/Ultra-Light-Fast-Generic-Face-Detector-1MB/master/models/onnx/version-RFB-320.onnx" "test_models/version-RFB-320.onnx"
          download_model "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/en_PP-OCRv3_det_infer.onnx" "test_models/ocr_det.onnx"
          download_model "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv3/en_PP-OCRv3_rec_infer.onnx" "test_models/ocr_rec.onnx"
          download_model "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/release/2.6/ppocr/utils/en_dict.txt" "test_models/en_dict.txt"
          download_model "https://huggingface.co/onnx-community/nsfw_image_detection-ONNX/resolve/main/onnx/model.onnx" "test_models/nsfw.onnx"
          download_model "https://huggingface.co/fsw/aesthetic-predictor-v2-5_onnx/resolve/main/aesthetic_predictor_v2_5.onnx" "test_models/aesthetics.onnx"
          download_model "https://huggingface.co/webml/yolov8n/resolve/main/onnx/yolov8n.onnx" "test_models/yolov8.onnx"
          download_model "https://huggingface.co/onnx-community/Salesforce_blip-image-captioning-base/resolve/main/split_0.onnx" "test_models/blip.onnx"
          download_model "https://huggingface.co/crj/dl-ws/resolve/main/arcface_w600k_r50.onnx" "test_models/arcface.onnx"
          download_model "https://huggingface.co/Xenova/dpt-hybrid-midas/resolve/main/onnx/model.onnx" "test_models/midas.onnx"
          download_model "https://huggingface.co/Xenova/whisper-tiny.en/resolve/main/onnx/encoder_model.onnx" "test_models/whisper.onnx"

          cargo test -- --ignored test_full_inference_on_sample
        working-directory: src-tauri

      - name: Build Tauri App (no bundle)
        run: npm run tauri build -- --no-bundle

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      ORT_STRATEGY: download
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libjs-mathjax build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libpostproc-dev

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Install dependencies (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip -o ffmpeg.zip
          unzip ffmpeg.zip
          FFMPEG_DIR=$(pwd)/ffmpeg-master-latest-win64-gpl-shared
          FFMPEG_DIR_WIN=$(cygpath -w "$FFMPEG_DIR")
          echo "FFMPEG_DIR=$FFMPEG_DIR_WIN" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=$FFMPEG_DIR_WIN\\include" >> $GITHUB_ENV
          echo "FFMPEG_LIB_DIR=$FFMPEG_DIR_WIN\\lib" >> $GITHUB_ENV
          echo "INCLUDE=$FFMPEG_DIR_WIN\\include" >> $GITHUB_ENV
          echo "LIB=$FFMPEG_DIR_WIN\\lib" >> $GITHUB_ENV
          echo "$FFMPEG_DIR_WIN\\lib" >> $GITHUB_PATH

      - name: Set MSVC include path for bindgen (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -property installationPath
          $latestMsvc = Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $includePath = Join-Path $latestMsvc.FullName "include"
          "BINDGEN_EXTRA_CLANG_ARGS=-I`"$includePath`"" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: npm install

      - name: Write signing key
        shell: bash
        run: |
          mkdir -p ~/.tauri
          printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > ~/.tauri/siegu.key
          echo "TAURI_SIGNING_PRIVATE_KEY=$HOME/.tauri/siegu.key" >> $GITHUB_ENV

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MediaSafe v__VERSION__'
          releaseBody: 'See the attached assets for the latest release versions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-24.04' && '--bundles appimage deb' || '' }}

  release-android:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Set up cargo-ndk
        run: cargo install cargo-ndk

      - run: npm install

      - name: Add NDK to local.properties
        run: |
          ANDROID_NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          echo "ndk.dir=$ANDROID_NDK_PATH" >> src-tauri/gen/android/local.properties
          echo "NDK_HOME=$ANDROID_NDK_PATH" >> $GITHUB_ENV

      - name: Build Android APK
        run: npm run tauri android build -- --apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  release-arch:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      ORT_STRATEGY: download
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git nodejs npm rustup webkit2gtk-4.1 libayatana-appindicator librsvg xdotool openssl sudo yarn xdg-utils fuse2

          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Build Arch AppImage
        run: |
          chown -R builder:builder .
          su builder -c "
            rustup default stable
            npm install
            APPIMAGE_EXTRACT_AND_RUN=1 npm run tauri build -- --bundles appimage
          "

      - name: Upload Arch AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage

  release-ios:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - run: npm install

      - run: npm run tauri ios build || echo "iOS build skipped/failed. Please configure code signing."
