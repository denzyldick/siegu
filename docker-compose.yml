services:
  signalling:
    image: ghcr.io/denzyldick/siegu-signal:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Uncomment to require a token on every Join/JoinRoom/CreateRoom:
      # SIEGU_SIGNAL_TOKEN: "change-me"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
