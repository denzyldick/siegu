services:
  signalling:
    image: ghcr.io/denzyldick/siegu-signal:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  webclient:
    build: ./webclient
    ports:
      - "8080:8080"
    depends_on:
      signalling:
        condition: service_healthy
