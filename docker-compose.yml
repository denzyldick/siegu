services:
  signalling:
    image: ghcr.io/denzyldick/siegu-signal:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Uncomment to require a token on every Join/JoinRoom/CreateRoom:
      # SIEGU_SIGNAL_TOKEN: "change-me"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  webclient:
    build: ./webclient
    ports:
      - "5173:5173"
    depends_on:
      signalling:
        condition: service_healthy
    environment:
      # The webclient dev server proxies /ws to the signalling server
      SIGNALING_URL: "ws://signalling:8080"
