services:
  signalling:
    image: ghcr.io/denzyldick/signalling-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SIGNAL_ADDR: ":8080"
      SIGNAL_MAX_PEERS: "2"
      SIGNAL_ROOM_TTL_SECS: "300"
      SIGNAL_MAX_CONNECTIONS: "1000"
      SIGNAL_MAX_MSG_SIZE: "32768"
      SIGNAL_RATE_PER_SEC: "10"
      SIGNAL_RATE_BURST: "20"
      SIGNAL_SHUTDOWN_TIMEOUT: "30"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
