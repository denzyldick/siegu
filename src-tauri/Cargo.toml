[package]
name = "siegu"
version = "0.1.0"
description = "A Tauri App"
authors = ["Denzyl Dick"]
license-file = "../LICENSE"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "siegu_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = { rev = "5aa49c0", git = "https://github.com/webrtc-rs/webrtc" }
jwalk = "0.8.1"
image-base64 = "0.1.0"
rustc-serialize = "0.3.24"
rusqlite = { version = "0.29.0", features = ["bundled"] }
rand = "0.8.5"
#tch = "0.14.0"
anyhow = "1.0.70"
image = "0.24.6"
lazy_static = "1.4.0"
kamadak-exif = "0.5.5"
oxipng = "8.0.0"
# tokio = { version = "1", features = ["full"] }
warp = "0.3"
tauri-plugin-os = "2"
get_if_addrs = "0.5.3"
#tch = "0.7.0"
yaml-rust = "0.4.5"
mime = "0.3.17"
tauri-plugin-fs = "2"
tauri-plugin-devtools = "2.0.0"
tauri-plugin-dialog = "2"
base64 = "0.22.1"
ndarray = "0.16.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio = "1.49.0"
bytes = "1.11.1"
crossbeam-channel = "0.5.15"
tokenizers = "0.19.1"
bip39 = { version = "2.2.2", features = ["std"] }
sha2 = "0.10.9"
hex = "0.4.3"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4"] }
rayon = "1.10.0"
num_cpus = "1.16.0"
ffmpeg-sidecar = { version = "2.4.0", features = ["download_ffmpeg"] }
tauri-plugin-notification = "2.3.3"
notify = "6"
heic = "0.1.4"

[dev-dependencies]
tempfile = "3.8"

[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "copy-dylibs", "download-binaries", "tls-rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
tract-onnx = "0.21.0"
