[package]
name = "siegu"
version = "0.1.0"
description = "A Tauri App"
authors = ["Denzyl Dick"]
license-file = "../LICENSE"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "siegu_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
siegu-core = { workspace = true }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = { rev = "5aa49c0", git = "https://github.com/webrtc-rs/webrtc" }
jwalk = "0.8.1"
image-base64 = "0.1.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rand = "0.8.6"
#tch = "0.14.0"
anyhow = "1.0.102"
image = "0.25.10"
lazy_static = "1.5.0"
kamadak-exif = "0.6.1"
oxipng = "10.1.1"
# tokio = { version = "1", features = ["full"] }
warp = { version = "0.4.3", features = ["server", "websocket"] }
tauri-plugin-os = "2"
get_if_addrs = "0.5.3"
#tch = "0.7.0"
yaml-rust = "0.4.5"
mime = "0.3.17"
tauri-plugin-fs = "2"
tauri-plugin-devtools = "2.0.0"
tauri-plugin-dialog = "2"
base64 = "0.22.1"
ndarray = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "sync", "net", "fs", "io-util", "time", "macros"] }
bytes = "1.11.1"
crossbeam-channel = "0.5.15"
tokenizers = "0.23.1"
bip39 = { version = "2.2.2", features = ["std"] }
sha2 = "0.10.9"
hex = "0.4.3"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
sysinfo = "0.33"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
rayon = "1.10.0"
num_cpus = "1.16.0"
tauri-plugin-notification = "2.3.3"
notify = "8.2.0"
heic = "0.1.6"
mdns-sd = "0.13"

[dev-dependencies]
tempfile = "3.19.0"
tungstenite = "0.28.0"

[target.'cfg(target_os = "windows")'.dependencies]
ffmpeg-next = "8.1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "copy-dylibs", "download-binaries", "tls-rustls"] }
tauri-plugin-updater = "2"
wallpaper = "3.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "windows")))'.dependencies]
ffmpeg-next = "8.1.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ffmpeg-next = { version = "8.1.0", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
tract-onnx = "0.21.0"
