[package]
name = "siegu-cli"
version = "0.1.0"
description = "CLI interface for Siegu — privacy-first media management"
authors = ["Denzyl Dick"]
license-file = "../../LICENSE"
edition = "2021"

[[bin]]
name = "siegu"
path = "src/main.rs"

[dependencies]
siegu-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
