[package]
name = "siegu-cli"
version = "0.1.0"
description = "CLI interface for Siegu — privacy-first media management"
authors = ["Denzyl Dick"]
license-file = "../../LICENSE"
edition = "2021"

[[bin]]
name = "siegu"
path = "src/main.rs"

[dependencies]
siegu-core = { workspace = true, default-features = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
rand = "0.8"
jwalk = "0.8"
rayon = "1"
ratatui = "0.30"
crossterm = "0.28"
