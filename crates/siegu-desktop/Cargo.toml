[package]
name = "siegu-desktop"
version = "0.1.0"
description = "Desktop GPUI + Ely spike for Siegu"
authors = ["Denzyl Dick"]
license-file = "../../LICENSE"
edition = "2021"
publish = false

[[bin]]
name = "siegu-desktop"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
jwalk = "0.8.1"
rayon = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
siegu-core = { workspace = true, default-features = true }
siegu-ui = { workspace = true, features = ["desktop"] }
