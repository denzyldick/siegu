[package]
name = "siegu-desktop"
version = "0.1.0"
description = "Desktop GPUI + Ely spike for Siegu"
authors = ["Denzyl Dick"]
license-file = "../../LICENSE"
edition = "2021"
publish = false

[[bin]]
name = "siegu-desktop"
path = "src/main.rs"

[dependencies]
siegu-core = { workspace = true, default-features = true }
siegu-ui = { workspace = true, features = ["desktop"] }
