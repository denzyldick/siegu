[workspace]
resolver = "2"
members = [
    "crates/siegu-core",
    "crates/siegu-cli",
    "crates/siegu-signal",
    "src-tauri",
]

[workspace.dependencies]
siegu-core = { path = "crates/siegu-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "sync", "net", "fs", "io-util", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10.9"
rand = "0.8.6"
bip39 = { version = "2.2.2", features = ["std"] }
hex = "0.4.3"
zeroize = { version = "1", features = ["derive"] }
sysinfo = "0.33"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
base64 = "0.22.1"
image = "0.25.10"
rayon = "1.10.0"
notify = "8.2.0"
kamadak-exif = "0.6.1"
ndarray = "0.16"
futures-util = "0.3.32"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
crossbeam-channel = "0.5.15"
tempfile = "3.19.0"
tungstenite = "0.28.0"
warp = { version = "0.4.3", features = ["server", "websocket"] }
ffmpeg-next = "8.1.0"
rustfft = "6.4.1"
heic = "0.1.6"
aes-gcm = "0.10"

[patch.crates-io]
esaxx-rs = { path = "src-tauri/vendor/esaxx-rs" }
