# cargo-audit configuration.
#
# Run from the workspace root: `cargo audit`. The workspace-level Cargo.lock
# is authoritative (a stale per-crate lockfile was removed).
#
# The advisory IDs below are all *warning*-level (unmaintained/unsound) findings
# from crates we cannot upgrade or drop at our level. They are documented here
# so `cargo audit` reports clean and any NEW advisory is not lost in the noise.
# Real error-severity vulnerabilities are never suppressed by this list.

[advisories]
ignore = [
  # --- tauri GTK3 stack (Linux tray + webview) -------------------------
  # Pulled in transitively via tauri (tray-icon -> libappindicator) and
  # tauri-runtime-wry (-> wry -> gdkx11). tauri still builds on GTK3;
  # the only fix (GTK4, glib >=0.20) requires an upstream tauri change.
  "RUSTSEC-2024-0370", # proc-macro-error 1.0.4 (build dep of glib-macros)
  "RUSTSEC-2024-0411", # gdkwayland-sys 0.18.2
  "RUSTSEC-2024-0412", # gdk 0.18.2
  "RUSTSEC-2024-0413", # atk 0.18.2
  "RUSTSEC-2024-0414", # gdkx11-sys 0.18.2
  "RUSTSEC-2024-0415", # gtk 0.18.2
  "RUSTSEC-2024-0416", # atk-sys 0.18.2
  "RUSTSEC-2024-0417", # gdkx11 0.18.2
  "RUSTSEC-2024-0418", # gdk-sys 0.18.2
  "RUSTSEC-2024-0419", # gtk3-macros 0.18.2
  "RUSTSEC-2024-0420", # gtk-sys 0.18.2
  "RUSTSEC-2024-0429", # glib 0.18.5 unsound (fixed only in glib >=0.20/GTK4)
  "RUSTSEC-2025-0121", # gcc 0.3.55 (legacy build script helper)

  # --- tauri-utils urlpattern -> unic-* (transitive) -------------------
  "RUSTSEC-2025-0075", # unic-char-range 0.9.0
  "RUSTSEC-2025-0080", # unic-common 0.9.0
  "RUSTSEC-2025-0081", # unic-char-property 0.9.0
  "RUSTSEC-2025-0098", # unic-ucd-version 0.9.0
  "RUSTSEC-2025-0100", # unic-ucd-ident 0.9.0

  # --- misc transitive, no upstream fix available ----------------------
  "RUSTSEC-2024-0436", # paste 1.0.15 (latest; used by image -> exr -> pulp)
  "RUSTSEC-2025-0119", # number_prefix 0.4.0 (indicatif, used by siegu-cli)
]
